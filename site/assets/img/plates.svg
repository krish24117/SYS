    <path pathLength="1" d="M148 244 L148 236"/>
  </symbol>

  <!-- Thread leaving the spool -->
  <symbol id="plate-spool" viewBox="0 0 200 260">
    <path pathLength="1" d="M74 66 Q100 56 126 66"/>
    <path pathLength="1" d="M74 76 Q100 86 126 76"/>
    <path pathLength="1" d="M74 71 L74 156"/>
    <path pathLength="1" d="M126 71 L126 156"/>
    <path pathLength="1" d="M74 156 Q100 168 126 156"/>
    <path pathLength="1" d="M78 100 Q100 108 122 100"/>
    <path pathLength="1" d="M78 124 Q100 132 122 124"/>
    <path pathLength="1" d="M126 148 C164 158 156 196 108 206 C66 214 74 236 118 234"/>
